<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Digital Marketing Executive Illustration">
  <defs>
    <linearGradient id="dm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="dm-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="dm-funnel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" rx="12" fill="url(#dm-bg)" />
  <circle cx="350" cy="50" r="75" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="50" cy="170" r="65" fill="#ffffff" fill-opacity="0.05" />

  <!-- Megaphone Graphic (Left) -->
  <g transform="translate(40, 50)">
    <!-- Broadcast Waves -->
    <path d="M125 35 A 40 40 0 0 1 125 85" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M137 25 A 55 55 0 0 1 137 95" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M149 15 A 70 70 0 0 1 149 105" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25" />

    <!-- Megaphone Cone -->
    <path d="M48 45 L110 22 L110 98 L48 75 Z" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="drop-shadow(0 8px 14px rgba(0,0,0,0.25))" />
    <!-- Cone Inner Lip -->
    <ellipse cx="110" cy="60" rx="7" ry="38" fill="#f43f5e" />
    <ellipse cx="110" cy="60" rx="3.5" ry="24" fill="#881337" />

    <!-- Speaker Base Body -->
    <rect x="22" y="44" width="28" height="32" rx="6" fill="#3b82f6" />
    <rect x="18" y="52" width="6" height="16" rx="3" fill="#60a5fa" />

    <!-- Handle -->
    <path d="M34 76 L26 112 A 4 4 0 0 0 32 116 L44 114 A 4 4 0 0 0 47 110 L44 76 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Floating Engagement / Reaction Bubbles -->
    <!-- Heart Bubble -->
    <g transform="translate(15, 12)">
      <circle cx="14" cy="14" r="14" fill="#f43f5e" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.2))" />
      <path d="M14 19s-5-3.5-5-6.5a3 3 0 0 1 5-1.5 3 3 0 0 1 5 1.5c0 3-5 6.5-5 6.5z" fill="#ffffff" />
    </g>

    <!-- Star / Click Cursor Bubble -->
    <g transform="translate(90, 110)">
      <circle cx="13" cy="13" r="13" fill="#fbbf24" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.2))" />
      <polygon points="13,6 15,11 20,11 16,14.5 17.5,19.5 13,16.5 8.5,19.5 10,14.5 6,11 11,11" fill="#78350f" />
    </g>
  </g>

  <!-- Performance Analytics & Funnel Card (Right) -->
  <g transform="translate(205, 26)">
    <rect width="165" height="168" rx="10" fill="url(#dm-card)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.28))" />

    <!-- Card Top Header -->
    <rect width="165" height="26" rx="10" fill="#faf5ff" />
    <circle cx="14" cy="13" r="3" fill="#a855f7" />
    <line x1="24" y1="13" x2="80" y2="13" stroke="#4c1d95" stroke-width="2" stroke-linecap="round" />
    <rect x="110" y="7" width="45" height="12" rx="3" fill="#f3e8ff" />
    <line x1="116" y1="13" x2="148" y2="13" stroke="#7e22ce" stroke-width="1.5" stroke-linecap="round" />

    <!-- Marketing Funnel Stages -->
    <g transform="translate(18, 38)">
      <!-- Stage 1: Impressions (Top) -->
      <polygon points="4,0 126,0 114,20 16,20" fill="#818cf8" />
      <line x1="45" y1="10" x2="85" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

      <!-- Stage 2: Clicks / Engagement (Middle) -->
      <polygon points="18,24 112,24 98,44 32,44" fill="#c084fc" />
      <line x1="50" y1="34" x2="80" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

      <!-- Stage 3: Conversions (Bottom) -->
      <polygon points="34,48 96,48 82,68 48,68" fill="#f43f5e" />
      <line x1="55" y1="58" x2="75" y2="58" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Metrics Row (ROAS & CTR) -->
    <g transform="translate(18, 116)">
      <!-- Metric 1: Reach Growth -->
      <rect x="0" y="0" width="60" height="38" rx="5" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1" />
      <text x="30" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a21caf" text-anchor="middle">+148%</text>
      <line x1="12" y1="26" x2="48" y2="26" stroke="#c026d3" stroke-width="2" stroke-linecap="round" />

      <!-- Metric 2: ROAS -->
      <rect x="68" y="0" width="62" height="38" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <text x="99" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">4.8x ROI</text>
      <line x1="80" y1="26" x2="118" y2="26" stroke="#059669" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
