<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Computer Engineer Illustration">
  <defs>
    <linearGradient id="cpe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cpe-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cpe-die" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cpe-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="400" height="220" rx="12" fill="url(#cpe-bg)" />
  <circle cx="350" cy="50" r="80" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="50" cy="180" r="70" fill="#ffffff" fill-opacity="0.05" />

  <!-- Embedded Hardware Architecture Board -->
  <g transform="translate(45, 25)">
    <rect width="310" height="170" rx="10" fill="url(#cpe-card)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.35))" />

    <!-- Board Header -->
    <rect width="310" height="24" rx="10" fill="#0b0f19" />
    <circle cx="16" cy="12" r="3.5" fill="#6366f1" />
    <circle cx="28" cy="12" r="3.5" fill="#818cf8" />
    <circle cx="40" cy="12" r="3.5" fill="#a5b4fc" />
    <path d="M 60 12 L 140 12" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Bus Routing Traces -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75">
      <path d="M 25 50 L 50 50 L 65 65 L 85 65" />
      <path d="M 25 65 L 45 65 L 55 75 L 85 75" />
      <path d="M 25 85 L 55 85 L 65 95 L 85 95" />
      <path d="M 25 110 L 45 110 L 60 125 L 85 125" />

      <path d="M 185 65 L 205 65 L 215 50 L 235 50" />
      <path d="M 185 85 L 210 85 L 220 75 L 235 75" />
      <path d="M 185 105 L 205 105 L 215 115 L 235 115" />
      <path d="M 185 125 L 215 125 L 225 140 L 235 140" />

      <path d="M 115 45 L 115 35 L 155 35 L 155 45" />
      <path d="M 125 145 L 125 158 L 165 158" />
    </g>

    <!-- CPU Socket & Silicon Die (Center) -->
    <g transform="translate(85, 45)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="8" cy="8" r="3" fill="#f59e0b" />

      <!-- LGA/BGA Gold Contact Pad Border -->
      <rect x="10" y="10" width="80" height="80" rx="4" fill="#0f172a" stroke="url(#cpe-gold)" stroke-width="1.2" stroke-dasharray="4 2" />

      <!-- Silicon Core Die -->
      <rect x="22" y="22" width="56" height="56" rx="4" fill="url(#cpe-die)" stroke="#38bdf8" stroke-width="1.2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))" />

      <line x1="22" y1="50" x2="78" y2="50" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <line x1="50" y1="22" x2="50" y2="78" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />

      <!-- Multi-Cores -->
      <rect x="28" y="28" width="18" height="18" rx="2" fill="#1e1b4b" stroke="#06b6d4" stroke-width="0.8" />
      <rect x="54" y="28" width="18" height="18" rx="2" fill="#1e1b4b" stroke="#06b6d4" stroke-width="0.8" />
      <rect x="28" y="54" width="18" height="18" rx="2" fill="#1e1b4b" stroke="#06b6d4" stroke-width="0.8" />
      <rect x="54" y="54" width="18" height="18" rx="2" fill="#1e1b4b" stroke="#06b6d4" stroke-width="0.8" />

      <circle cx="37" cy="37" r="3" fill="#38bdf8" />
      <circle cx="63" cy="37" r="3" fill="#38bdf8" />
      <circle cx="37" cy="63" r="3" fill="#38bdf8" />
      <circle cx="63" cy="63" r="3" fill="#38bdf8" />
    </g>

    <!-- Memory DIMM Slots (Right) -->
    <g transform="translate(235, 42)">
      <rect x="0" y="0" width="16" height="106" rx="3" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <rect x="3" y="10" width="10" height="16" rx="1" fill="#334155" />
      <rect x="3" y="32" width="10" height="16" rx="1" fill="#334155" />
      <rect x="3" y="54" width="10" height="16" rx="1" fill="#334155" />
      <rect x="3" y="76" width="10" height="16" rx="1" fill="#334155" />
      <polygon points="4,-4 12,-4 8,0" fill="#cbd5e1" />
      <polygon points="4,110 12,110 8,106" fill="#cbd5e1" />

      <rect x="24" y="0" width="16" height="106" rx="3" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <rect x="27" y="10" width="10" height="16" rx="1" fill="#334155" />
      <rect x="27" y="32" width="10" height="16" rx="1" fill="#334155" />
      <rect x="27" y="54" width="10" height="16" rx="1" fill="#334155" />
      <rect x="27" y="76" width="10" height="16" rx="1" fill="#334155" />
      <polygon points="28,-4 36,-4 32,0" fill="#cbd5e1" />
      <polygon points="28,110 36,110 32,106" fill="#cbd5e1" />
    </g>

    <!-- Crystal Oscillator (Bottom Left) -->
    <g transform="translate(24, 134)">
      <rect x="0" y="4" width="36" height="16" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
      <circle cx="18" cy="12" r="3" fill="#6366f1" />
    </g>
  </g>
</svg>
