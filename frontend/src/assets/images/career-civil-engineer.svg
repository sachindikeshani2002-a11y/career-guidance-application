<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Civil Engineer Illustration">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="ce-blueprint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <pattern id="ce-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="220" rx="12" fill="url(#ce-bg)" />
  <circle cx="360" cy="40" r="80" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="40" cy="190" r="70" fill="#ffffff" fill-opacity="0.05" />

  <!-- Blueprint Workstation Window -->
  <g transform="translate(45, 25)">
    <rect width="310" height="170" rx="10" fill="url(#ce-blueprint)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.45" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))" />
    <rect width="310" height="170" rx="10" fill="url(#ce-grid)" />

    <!-- Technical Header Bar -->
    <rect width="310" height="24" rx="10" fill="#0b172a" />
    <circle cx="16" cy="12" r="3.5" fill="#38bdf8" />
    <circle cx="28" cy="12" r="3.5" fill="#60a5fa" />
    <circle cx="40" cy="12" r="3.5" fill="#93c5fd" />
    <path d="M 60 12 L 140 12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Technical Scale Legend -->
    <rect x="230" y="8" width="65" height="10" rx="3" fill="#0284c7" fill-opacity="0.4" />
    <line x1="235" y1="13" x2="290" y2="13" stroke="#38bdf8" stroke-width="1" />
    <line x1="235" y1="10" x2="235" y2="16" stroke="#38bdf8" stroke-width="1" />
    <line x1="262" y1="11" x2="262" y2="15" stroke="#38bdf8" stroke-width="1" />
    <line x1="290" y1="10" x2="290" y2="16" stroke="#38bdf8" stroke-width="1" />

    <!-- Skyscraper Structural Frame (Left) -->
    <g transform="translate(24, 36)">
      <!-- Main Columns -->
      <rect x="0" y="16" width="60" height="108" fill="none" stroke="#60a5fa" stroke-width="1.5" />
      <line x1="20" y1="16" x2="20" y2="124" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="40" y1="16" x2="40" y2="124" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
      <!-- Floors -->
      <line x1="0" y1="38" x2="60" y2="38" stroke="#60a5fa" stroke-width="1.2" />
      <line x1="0" y1="60" x2="60" y2="60" stroke="#60a5fa" stroke-width="1.2" />
      <line x1="0" y1="82" x2="60" y2="82" stroke="#60a5fa" stroke-width="1.2" />
      <line x1="0" y1="104" x2="60" y2="104" stroke="#60a5fa" stroke-width="1.2" />
      <!-- Cross Bracing -->
      <line x1="0" y1="38" x2="60" y2="60" stroke="#0284c7" stroke-width="1" />
      <line x1="60" y1="38" x2="0" y2="60" stroke="#0284c7" stroke-width="1" />
      <line x1="0" y1="60" x2="60" y2="82" stroke="#0284c7" stroke-width="1" />
      <line x1="60" y1="60" x2="0" y2="82" stroke="#0284c7" stroke-width="1" />
      <!-- Roof Structure / Apex -->
      <path d="M 0 16 L 30 0 L 60 16" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="30" y1="0" x2="30" y2="16" stroke="#38bdf8" stroke-width="1" />
      <circle cx="30" cy="0" r="2.5" fill="#f59e0b" />
    </g>

    <!-- Cable-Stayed Bridge Structure (Center & Right) -->
    <g transform="translate(100, 46)">
      <!-- Central Pylon Tower -->
      <polygon points="80,0 86,114 74,114" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="80" y1="0" x2="80" y2="114" stroke="#60a5fa" stroke-width="1" />
      <circle cx="80" cy="2" r="3" fill="#f59e0b" />

      <!-- Horizontal Deck -->
      <rect x="0" y="86" width="190" height="8" rx="2" fill="#0f172a" stroke="#93c5fd" stroke-width="1.2" />
      <line x1="0" y1="90" x2="190" y2="90" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Support Piers -->
      <rect x="20" y="94" width="14" height="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
      <rect x="146" y="94" width="14" height="20" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />

      <!-- Stay Cables (Left Side) -->
      <line x1="80" y1="12" x2="10" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />
      <line x1="80" y1="26" x2="25" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />
      <line x1="80" y1="40" x2="42" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />
      <line x1="80" y1="54" x2="60" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />

      <!-- Stay Cables (Right Side) -->
      <line x1="80" y1="12" x2="180" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />
      <line x1="80" y1="26" x2="155" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />
      <line x1="80" y1="40" x2="130" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />
      <line x1="80" y1="54" x2="105" y2="86" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.85" />

      <!-- Deck Truss Framework under road -->
      <path d="M 0 94 L 10 106 L 20 94 L 34 106 L 48 94 L 62 106 L 74 94" fill="none" stroke="#38bdf8" stroke-width="0.8" />
      <path d="M 86 94 L 100 106 L 114 94 L 128 106 L 146 94 L 160 106 L 174 94 L 188 106" fill="none" stroke="#38bdf8" stroke-width="0.8" />
    </g>

    <!-- Drafting Precision Ruler (Bottom Right) -->
    <g transform="translate(196, 142)">
      <rect width="102" height="18" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <line x1="10" y1="4" x2="10" y2="14" stroke="#f59e0b" stroke-width="1" />
      <line x1="25" y1="4" x2="25" y2="10" stroke="#f59e0b" stroke-width="1" />
      <line x1="40" y1="4" x2="40" y2="14" stroke="#f59e0b" stroke-width="1" />
      <line x1="55" y1="4" x2="55" y2="10" stroke="#f59e0b" stroke-width="1" />
      <line x1="70" y1="4" x2="70" y2="14" stroke="#f59e0b" stroke-width="1" />
      <line x1="85" y1="4" x2="85" y2="10" stroke="#f59e0b" stroke-width="1" />
      <line x1="98" y1="4" x2="98" y2="14" stroke="#f59e0b" stroke-width="1" />
    </g>
  </g>
</svg>
