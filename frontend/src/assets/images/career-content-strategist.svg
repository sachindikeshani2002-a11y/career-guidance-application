<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Content Strategist Illustration">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="cs-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" rx="12" fill="url(#cs-bg)" />
  <circle cx="340" cy="45" r="75" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="50" cy="180" r="65" fill="#ffffff" fill-opacity="0.05" />

  <!-- Editorial Document & Strategy Article (Left) -->
  <g transform="translate(35, 26)">
    <rect width="180" height="168" rx="10" fill="url(#cs-card)" stroke="#fdba74" stroke-width="1.2" stroke-opacity="0.5" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.28))" />

    <!-- Article Header -->
    <rect width="180" height="24" rx="10" fill="#fff7ed" />
    <circle cx="14" cy="12" r="3" fill="#ea580c" />
    <line x1="24" y1="12" x2="80" y2="12" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- SEO & Topic Tags -->
    <g transform="translate(16, 32)">
      <rect width="36" height="12" rx="3" fill="#fed7aa" />
      <line x1="6" y1="6" x2="30" y2="6" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" />

      <rect x="42" width="46" height="12" rx="3" fill="#dbeafe" />
      <line x1="48" y1="6" x2="82" y2="6" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" />

      <rect x="94" width="38" height="12" rx="3" fill="#dcfce7" />
      <line x1="100" y1="6" x2="126" y2="6" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Main Headline & Subtitle -->
    <rect x="16" y="52" width="130" height="8" rx="4" fill="#1e293b" />
    <rect x="16" y="65" width="90" height="5" rx="2.5" fill="#64748b" />

    <!-- Article Body Columns & Formatting -->
    <g transform="translate(16, 78)">
      <!-- Pullquote Banner (Left accent) -->
      <rect x="0" y="0" width="3" height="34" rx="1.5" fill="#ea580c" />
      <rect x="8" y="4" width="60" height="4" rx="2" fill="#ea580c" />
      <rect x="8" y="12" width="50" height="3.5" rx="1.5" fill="#94a3b8" />
      <rect x="8" y="20" width="56" height="3.5" rx="1.5" fill="#94a3b8" />

      <!-- Hero Thumbnail Box -->
      <rect x="76" y="0" width="70" height="34" rx="4" fill="#ffedd5" stroke="#fed7aa" stroke-width="1" />
      <circle cx="95" cy="14" r="5" fill="#fb923c" />
      <polygon points="84,30 102,18 116,28 130,16 142,30" fill="#fdba74" />
    </g>

    <!-- Lower Text Paragraphs -->
    <g transform="translate(16, 122)">
      <line x1="0" y1="0" x2="148" y2="0" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="8" x2="135" y2="8" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="16" x2="142" y2="16" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="24" x2="105" y2="24" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Editorial Calendar & Publishing Grid (Right) -->
  <g transform="translate(230, 26)">
    <rect width="135" height="168" rx="10" fill="url(#cs-card)" stroke="#fdba74" stroke-width="1.2" stroke-opacity="0.5" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.28))" />

    <!-- Calendar Header -->
    <rect width="135" height="26" rx="10" fill="#fff7ed" />
    <!-- Mini Calendar Icon -->
    <rect x="12" y="8" width="12" height="11" rx="2" fill="#ea580c" />
    <line x1="14" y1="6" x2="14" y2="8" stroke="#ffffff" stroke-width="1" />
    <line x1="22" y1="6" x2="22" y2="8" stroke="#ffffff" stroke-width="1" />
    <line x1="30" y1="13" x2="86" y2="13" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- Calendar Multi-Channel Schedule Entries -->
    <g transform="translate(12, 36)">
      <!-- Day 1: Blog Post -->
      <g transform="translate(0, 0)">
        <rect width="111" height="26" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
        <circle cx="10" cy="13" r="3.5" fill="#ea580c" />
        <rect x="20" y="8" width="55" height="4" rx="2" fill="#1e293b" />
        <rect x="20" y="15" width="35" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="85" y="7" width="20" height="12" rx="2" fill="#ffedd5" />
        <line x1="88" y1="13" x2="102" y2="13" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Day 2: Social Thread -->
      <g transform="translate(0, 32)">
        <rect width="111" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <circle cx="10" cy="13" r="3.5" fill="#3b82f6" />
        <rect x="20" y="8" width="60" height="4" rx="2" fill="#1e293b" />
        <rect x="20" y="15" width="40" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="85" y="7" width="20" height="12" rx="2" fill="#dbeafe" />
        <line x1="88" y1="13" x2="102" y2="13" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Day 3: Video Newsletter -->
      <g transform="translate(0, 64)">
        <rect width="111" height="26" rx="4" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1" />
        <circle cx="10" cy="13" r="3.5" fill="#c026d3" />
        <rect x="20" y="8" width="52" height="4" rx="2" fill="#1e293b" />
        <rect x="20" y="15" width="32" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="85" y="7" width="20" height="12" rx="2" fill="#fae8ff" />
        <line x1="88" y1="13" x2="102" y2="13" stroke="#a21caf" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Day 4: Case Study Release -->
      <g transform="translate(0, 96)">
        <rect width="111" height="26" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
        <circle cx="10" cy="13" r="3.5" fill="#16a34a" />
        <rect x="20" y="8" width="58" height="4" rx="2" fill="#1e293b" />
        <rect x="20" y="15" width="38" height="3" rx="1.5" fill="#94a3b8" />
        <rect x="85" y="7" width="20" height="12" rx="2" fill="#dcfce7" />
        <line x1="88" y1="13" x2="102" y2="13" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
