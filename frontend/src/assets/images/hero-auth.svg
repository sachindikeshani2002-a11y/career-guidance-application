<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none" role="img" aria-label="Career Path Exploration Illustration">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#405de0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7355db" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="hero-grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8faff" />
    </linearGradient>
    <linearGradient id="hero-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4361e5" />
      <stop offset="100%" stop-color="#7355db" />
    </linearGradient>
    <linearGradient id="hero-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="hero-shadow" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17233d" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="270" cy="190" r="170" fill="url(#hero-bg)" filter="blur(20px)" />
  <circle cx="440" cy="90" r="45" fill="#4361e5" fill-opacity="0.08" />
  <circle cx="90" cy="290" r="60" fill="#7355db" fill-opacity="0.08" />

  <!-- Flowing Career Pathway Line -->
  <path d="M 60 310 C 140 310, 160 210, 270 210 C 370 210, 390 120, 480 110" stroke="#4361e5" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.4" />

  <!-- Main Canvas Card (IDE & Dashboard Window) -->
  <g filter="url(#hero-shadow)">
    <rect x="90" y="60" width="360" height="250" rx="16" fill="url(#hero-grad-card)" stroke="#e6eaf2" stroke-width="1.5" />

    <!-- Window Header -->
    <rect x="90" y="60" width="360" height="38" rx="16" fill="#f5f7fc" />
    <path d="M 90 98 L 450 98" stroke="#e6eaf2" stroke-width="1" />
    <circle cx="114" cy="79" r="5" fill="#ef4444" />
    <circle cx="130" cy="79" r="5" fill="#f59e0b" />
    <circle cx="146" cy="79" r="5" fill="#10b981" />
    <rect x="175" y="73" width="160" height="12" rx="6" fill="#e6eaf2" />

    <!-- Sidebar in Window -->
    <rect x="105" y="112" width="70" height="180" rx="8" fill="#f8fafc" />
    <rect x="115" y="124" width="50" height="8" rx="4" fill="#4361e5" fill-opacity="0.7" />
    <rect x="115" y="142" width="42" height="6" rx="3" fill="#cbd5e1" />
    <rect x="115" y="156" width="46" height="6" rx="3" fill="#cbd5e1" />
    <rect x="115" y="170" width="38" height="6" rx="3" fill="#cbd5e1" />
    <rect x="115" y="184" width="44" height="6" rx="3" fill="#cbd5e1" />

    <!-- Content Area (Chart & Metrics) -->
    <rect x="190" y="112" width="244" height="85" rx="10" fill="#f0f4ff" stroke="#dbe4ff" stroke-width="1" />
    <text x="206" y="134" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4361e5">CAREER MATCH: 92%</text>

    <!-- Progress Bar Inside Window -->
    <rect x="206" y="146" width="210" height="8" rx="4" fill="#e0e7ff" />
    <rect x="206" y="146" width="190" height="8" rx="4" fill="url(#hero-accent)" />

    <rect x="206" y="166" width="60" height="18" rx="4" fill="#ffffff" stroke="#c7d2fe" />
    <text x="214" y="179" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#4361e5">Software Dev</text>

    <rect x="274" y="166" width="64" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="282" y="179" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b">Data Analyst</text>

    <!-- Mini Analytics Bar Graph -->
    <rect x="190" y="210" width="115" height="82" rx="10" fill="#ffffff" stroke="#e6eaf2" stroke-width="1" />
    <text x="202" y="228" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e293b">Skill Growth</text>
    <rect x="206" y="264" width="14" height="20" rx="3" fill="#c7d2fe" />
    <rect x="226" y="252" width="14" height="32" rx="3" fill="#818cf8" />
    <rect x="246" y="244" width="14" height="40" rx="3" fill="#6366f1" />
    <rect x="266" y="236" width="14" height="48" rx="3" fill="#4361e5" />

    <!-- Mini Course Achievement Card -->
    <rect x="315" y="210" width="119" height="82" rx="10" fill="#ffffff" stroke="#e6eaf2" stroke-width="1" />
    <circle cx="335" cy="235" r="12" fill="url(#hero-green)" fill-opacity="0.15" />
    <path d="M 330 235 L 334 239 L 341 231" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="354" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Enrolled</text>
    <rect x="325" y="258" width="98" height="6" rx="3" fill="#f1f5f9" />
    <rect x="325" y="270" width="70" height="6" rx="3" fill="#f1f5f9" />
  </g>

  <!-- Floating Floating Milestone Badges with Drop Shadows -->
  <g filter="url(#hero-shadow)">
    <!-- Top-Right Milestone Badge -->
    <rect x="380" y="32" width="130" height="46" rx="12" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5" />
    <circle cx="402" cy="55" r="14" fill="#eff6ff" />
    <path d="M 397 55 L 401 59 L 408 51" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="424" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e293b">Target Saved</text>
    <text x="424" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Ready to learn</text>
  </g>

  <g filter="url(#hero-shadow)">
    <!-- Bottom-Left Badge -->
    <rect x="30" y="240" width="125" height="46" rx="12" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5" />
    <circle cx="52" cy="263" r="14" fill="#f5f3ff" />
    <text x="47" y="268" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7c3aed">★</text>
    <text x="74" y="259" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e293b">Certificates</text>
    <text x="74" y="271" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Verified skills</text>
  </g>
</svg>
