<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Data Analyst Career Thumbnail">
  <defs>
    <linearGradient id="da-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="da-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="400" height="220" rx="12" fill="url(#da-bg)" />
  <circle cx="340" cy="50" r="90" fill="#ffffff" fill-opacity="0.07" />

  <!-- Analytics Board Window -->
  <g transform="translate(45, 25)">
    <rect width="310" height="170" rx="10" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.25))" />

    <!-- Title Area -->
    <rect width="310" height="32" rx="10" fill="#f8fafc" />
    <path d="M 0 32 L 310 32" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#0284c7" />
    <text x="28" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Metrics &amp; Insights Dashboard</text>
    <rect x="235" y="10" width="60" height="13" rx="4" fill="#e0f2fe" />
    <text x="242" y="20" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0369a1">Python · SQL</text>

    <!-- Stat Pill Left -->
    <rect x="18" y="44" width="80" height="42" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="26" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">Accuracy</text>
    <text x="26" y="78" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534">98.4%</text>

    <!-- Stat Pill Middle -->
    <rect x="106" y="44" width="80" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="114" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#0369a1">Growth</text>
    <text x="114" y="78" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#075985">+34.2%</text>

    <!-- Stat Pill Right -->
    <rect x="194" y="44" width="98" height="42" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
    <text x="202" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#7e22ce">Data Volume</text>
    <text x="202" y="78" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#6b21a8">1.2M rows</text>

    <!-- Trendline Graph Background -->
    <rect x="18" y="96" width="274" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <line x1="28" y1="144" x2="282" y2="144" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="28" y1="120" x2="282" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Bar columns -->
    <rect x="35" y="128" width="12" height="16" rx="2" fill="#bae6fd" />
    <rect x="55" y="120" width="12" height="24" rx="2" fill="#7dd3fc" />
    <rect x="75" y="112" width="12" height="32" rx="2" fill="#38bdf8" />
    <rect x="95" y="106" width="12" height="38" rx="2" fill="#0ea5e9" />

    <!-- Trend Curve -->
    <path d="M 115 138 C 145 134, 160 114, 195 118 C 225 122, 245 106, 280 102" stroke="url(#da-line)" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="280" cy="102" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
