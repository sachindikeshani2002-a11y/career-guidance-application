<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="Data Visualization Course Thumbnail">
  <defs>
    <linearGradient id="cdv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="10" fill="url(#cdv-bg)" />
  <circle cx="350" cy="50" r="70" fill="#ffffff" fill-opacity="0.08" />

  <!-- Multi-chart composition -->
  <g transform="translate(130, 40)">
    <rect width="140" height="120" rx="14" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.25))" />

    <!-- Bar chart on left -->
    <rect x="20" y="70" width="12" height="30" rx="2" fill="#06b6d4" />
    <rect x="36" y="52" width="12" height="48" rx="2" fill="#0891b2" />
    <rect x="52" y="38" width="12" height="62" rx="2" fill="#0e7490" />

    <!-- Donut chart on right -->
    <circle cx="98" cy="65" r="24" stroke="#e2e8f0" stroke-width="8" fill="none" />
    <circle cx="98" cy="65" r="24" stroke="#f59e0b" stroke-width="8" stroke-dasharray="45 150" stroke-linecap="round" fill="none" />
    <circle cx="98" cy="65" r="24" stroke="#06b6d4" stroke-width="8" stroke-dasharray="60 150" stroke-dashoffset="-50" stroke-linecap="round" fill="none" />
  </g>
</svg>
