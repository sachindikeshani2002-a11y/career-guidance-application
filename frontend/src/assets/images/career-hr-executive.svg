<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Human Resources Executive Illustration">
  <defs>
    <linearGradient id="hr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="hr-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" rx="12" fill="url(#hr-bg)" />
  <circle cx="340" cy="40" r="75" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="50" cy="180" r="65" fill="#ffffff" fill-opacity="0.05" />

  <!-- Main Candidate Profile Card (Left) -->
  <g transform="translate(35, 30)">
    <rect width="180" height="160" rx="10" fill="url(#hr-card)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.28))" />

    <!-- Top Card Header Accent -->
    <path d="M0 10C0 4.477 4.477 0 10 0h160c5.523 0 10 4.477 10 10v22H0V10z" fill="#ede9fe" />

    <!-- Candidate Avatar -->
    <circle cx="42" cy="50" r="22" fill="#818cf8" />
    <!-- Avatar Person Icon -->
    <circle cx="42" cy="45" r="8" fill="#ffffff" />
    <path d="M28 62c0-7.732 6.268-11 14-11s14 3.268 14 11" fill="#ffffff" />

    <!-- Candidate Name & Position Bars -->
    <rect x="74" y="42" width="85" height="7" rx="3.5" fill="#1e293b" />
    <rect x="74" y="55" width="60" height="5" rx="2.5" fill="#64748b" />

    <!-- Star Ratings -->
    <g transform="translate(74, 68)">
      <polygon points="5,0 6.5,3.5 10,3.8 7.5,6.2 8.2,9.8 5,8 1.8,9.8 2.5,6.2 0,3.8 3.5,3.5" fill="#f59e0b" />
      <polygon points="18,0 19.5,3.5 23,3.8 20.5,6.2 21.2,9.8 18,8 14.8,9.8 15.5,6.2 13,3.8 16.5,3.5" fill="#f59e0b" />
      <polygon points="31,0 32.5,3.5 36,3.8 33.5,6.2 34.2,9.8 31,8 27.8,9.8 28.5,6.2 26,3.8 29.5,3.5" fill="#f59e0b" />
      <polygon points="44,0 45.5,3.5 49,3.8 46.5,6.2 47.2,9.8 44,8 40.8,9.8 41.5,6.2 39,3.8 42.5,3.5" fill="#f59e0b" />
      <polygon points="57,0 58.5,3.5 62,3.8 59.5,6.2 60.2,9.8 57,8 53.8,9.8 54.5,6.2 52,3.8 55.5,3.5" fill="#f59e0b" />
    </g>

    <!-- Divider Line -->
    <line x1="16" y1="88" x2="164" y2="88" stroke="#e2e8f0" stroke-width="1" />

    <!-- Skill Tags -->
    <rect x="18" y="98" width="46" height="14" rx="4" fill="#dbeafe" />
    <line x1="26" y1="105" x2="56" y2="105" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />

    <rect x="70" y="98" width="48" height="14" rx="4" fill="#d1fae5" />
    <line x1="78" y1="105" x2="110" y2="105" stroke="#059669" stroke-width="2" stroke-linecap="round" />

    <rect x="124" y="98" width="38" height="14" rx="4" fill="#fef3c7" />
    <line x1="131" y1="105" x2="155" y2="105" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

    <!-- Status Badge (Shortlisted) -->
    <g transform="translate(18, 124)">
      <rect width="144" height="22" rx="5" fill="#ede9fe" />
      <circle cx="16" cy="11" r="5" fill="#10b981" />
      <path d="M14 11l1.5 1.5 3-3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="11" x2="120" y2="11" stroke="#4338ca" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Side: Recruitment Pipeline & Team Hierarchy -->
  <g transform="translate(230, 30)">
    <!-- Hiring Pipeline Box -->
    <rect width="135" height="88" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.2))" />
    <rect width="135" height="20" rx="8" fill="#f1f5f9" />
    <circle cx="12" cy="10" r="3" fill="#6366f1" />
    <line x1="22" y1="10" x2="80" y2="10" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Pipeline Steps -->
    <g transform="translate(14, 28)">
      <!-- Step 1: Sourcing (Checked) -->
      <circle cx="6" cy="7" r="5" fill="#10b981" />
      <path d="M4 7l1.5 1.5 3-3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
      <line x1="18" y1="7" x2="90" y2="7" stroke="#334155" stroke-width="2" stroke-linecap="round" />

      <!-- Step 2: Technical Interview (Checked) -->
      <circle cx="6" cy="25" r="5" fill="#10b981" />
      <path d="M4 25l1.5 1.5 3-3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
      <line x1="18" y1="25" x2="100" y2="25" stroke="#334155" stroke-width="2" stroke-linecap="round" />

      <!-- Step 3: Offer Stage (Active) -->
      <circle cx="6" cy="43" r="5" fill="#6366f1" />
      <circle cx="6" cy="43" r="2" fill="#ffffff" />
      <line x1="18" y1="43" x2="75" y2="43" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Team Organization Tree (Below Pipeline) -->
    <g transform="translate(0, 100)">
      <rect width="135" height="60" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#c7d2fe" stroke-width="1" />

      <!-- Top Manager Avatar -->
      <circle cx="67" cy="16" r="8" fill="#4f46e5" />
      <circle cx="67" cy="14" r="3" fill="#ffffff" />
      <path d="M62 21c0-2.5 2-4 5-4s5 1.5 5 4" fill="#ffffff" />

      <!-- Connecting Lines -->
      <path d="M67 24v8 M30 32h74 M30 32v6 M67 32v6 M104 32v6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

      <!-- Left Team Member -->
      <circle cx="30" cy="44" r="6" fill="#06b6d4" />
      <circle cx="30" cy="42" r="2.2" fill="#ffffff" />

      <!-- Middle Team Member -->
      <circle cx="67" cy="44" r="6" fill="#10b981" />
      <circle cx="67" cy="42" r="2.2" fill="#ffffff" />

      <!-- Right Team Member -->
      <circle cx="104" cy="44" r="6" fill="#f59e0b" />
      <circle cx="104" cy="42" r="2.2" fill="#ffffff" />
    </g>
  </g>

  <!-- Magnifying Glass Accent -->
  <g transform="translate(185, 125) rotate(-20)">
    <circle cx="18" cy="18" r="14" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="3" />
    <line x1="28" y1="28" x2="42" y2="42" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
