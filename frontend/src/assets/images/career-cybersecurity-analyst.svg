<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Cybersecurity Analyst Illustration">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sec-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="sec-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="400" height="220" rx="12" fill="url(#sec-bg)" />
  <circle cx="340" cy="50" r="80" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="50" cy="180" r="70" fill="#ffffff" fill-opacity="0.05" />

  <!-- Security Operations Center Console -->
  <g transform="translate(45, 25)">
    <rect width="310" height="170" rx="10" fill="url(#sec-card)" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.4" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.4))" />

    <!-- SOC Titlebar -->
    <rect width="310" height="24" rx="10" fill="#030712" />
    <circle cx="16" cy="12" r="3.5" fill="#ef4444" />
    <circle cx="28" cy="12" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="12" r="3.5" fill="#10b981" />
    <path d="M 60 12 L 140 12" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Network Graph Backdrop -->
    <g stroke="#1e293b" stroke-width="1.2" stroke-linecap="round">
      <line x1="30" y1="55" x2="65" y2="85" />
      <line x1="65" y1="85" x2="35" y2="125" />
      <line x1="65" y1="85" x2="115" y2="95" />
      <line x1="195" y1="95" x2="245" y2="75" />
      <line x1="245" y1="75" x2="280" y2="55" />
      <line x1="245" y1="75" x2="275" y2="115" />
      <line x1="195" y1="95" x2="235" y2="135" />
    </g>

    <!-- Network Nodes -->
    <circle cx="30" cy="55" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="65" cy="85" r="7" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="35" cy="125" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />

    <circle cx="280" cy="55" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="245" cy="75" r="7" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="275" cy="115" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="235" cy="135" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Central Security Shield Emblem -->
    <g transform="translate(115, 38)">
      <path d="M 40 4 L 74 18 C 74 58, 54 84, 40 94 C 26 84, 6 58, 6 18 Z" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
      <path d="M 40 10 L 68 22 C 68 54, 50 76, 40 85 C 30 76, 12 54, 12 22 Z" fill="url(#sec-shield)" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.3))" />
      <path d="M 40 10 L 40 85" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

      <!-- Hardened Padlock -->
      <g transform="translate(25, 32)">
        <path d="M 7 14 L 7 7 C 7 0, 23 0, 23 7 L 23 14" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
        <rect x="2" y="12" width="26" height="22" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />
        <circle cx="15" cy="20" r="3" fill="#38bdf8" />
        <polygon points="14,21 16,21 17,28 13,28" fill="#38bdf8" />
      </g>
    </g>

    <!-- Threat Activity Bar Graph (Bottom Left) -->
    <g transform="translate(20, 134)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#030712" stroke="#1f2937" stroke-width="1" />
      <rect x="8" y="14" width="6" height="6" rx="1" fill="#10b981" />
      <rect x="18" y="10" width="6" height="10" rx="1" fill="#10b981" />
      <rect x="28" y="6" width="6" height="14" rx="1" fill="#38bdf8" />
      <rect x="38" y="12" width="6" height="8" rx="1" fill="#10b981" />
      <rect x="48" y="8" width="6" height="12" rx="1" fill="#10b981" />
      <rect x="58" y="4" width="6" height="16" rx="1" fill="#22c55e" />
      <rect x="68" y="10" width="6" height="10" rx="1" fill="#10b981" />
    </g>

    <!-- Terminal Command Defense Indicator (Bottom Right) -->
    <g transform="translate(210, 134)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#030712" stroke="#1f2937" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#10b981" />
      <line x1="22" y1="12" x2="75" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
