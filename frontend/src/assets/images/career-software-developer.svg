<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Software Developer Career Thumbnail">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sd-code-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="220" rx="12" fill="url(#sd-bg)" />
  <circle cx="360" cy="40" r="80" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="40" cy="190" r="70" fill="#ffffff" fill-opacity="0.06" />

  <!-- Code Editor Window -->
  <g transform="translate(45, 25)">
    <rect width="310" height="170" rx="10" fill="url(#sd-code-bg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))" />

    <!-- Titlebar -->
    <rect width="310" height="26" rx="10" fill="#1e293b" />
    <circle cx="16" cy="13" r="4" fill="#ef4444" />
    <circle cx="28" cy="13" r="4" fill="#f59e0b" />
    <circle cx="40" cy="13" r="4" fill="#10b981" />
    <text x="56" y="16" font-family="'Fira Code', monospace, sans-serif" font-size="9" fill="#94a3b8">DeveloperWorkspace.js</text>

    <!-- Code lines -->
    <text x="20" y="52" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#c084fc">import</text>
    <text x="65" y="52" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#f1f5f9">{ CareerPath }</text>
    <text x="160" y="52" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#c084fc">from</text>
    <text x="195" y="52" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#34d399">"software-dev"</text>

    <text x="20" y="74" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#60a5fa">const</text>
    <text x="60" y="74" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#f1f5f9">skills = [</text>
    <text x="120" y="74" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#fbbf24">"JavaScript", "Git", "SQL"</text>
    <text x="270" y="74" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#f1f5f9">];</text>

    <!-- Function block -->
    <text x="20" y="98" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#38bdf8">function</text>
    <text x="75" y="98" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#f43f5e">buildApplication</text>
    <text x="175" y="98" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#f1f5f9">(skills) {</text>

    <text x="40" y="120" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#c084fc">return</text>
    <text x="85" y="120" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#34d399">skills.deploy({ state: "ready" });</text>

    <text x="20" y="142" font-family="'Fira Code', monospace, sans-serif" font-size="11" fill="#f1f5f9">}</text>
  </g>
</svg>
