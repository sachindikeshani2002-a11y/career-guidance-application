<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="Business Analyst Illustration">
  <defs>
    <linearGradient id="ba-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="ba-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <rect width="400" height="220" rx="12" fill="url(#ba-bg)" />
  <circle cx="340" cy="50" r="85" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="50" cy="180" r="75" fill="#ffffff" fill-opacity="0.05" />

  <!-- Process Modeling & Analytics Canvas -->
  <g transform="translate(45, 25)">
    <rect width="310" height="170" rx="10" fill="url(#ba-card)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.25))" />

    <!-- Title Bar -->
    <rect width="310" height="26" rx="10" fill="#f1f5f9" />
    <circle cx="16" cy="13" r="3.5" fill="#6d28d9" />
    <rect x="28" y="11" width="80" height="4" rx="2" fill="#1e293b" />
    <rect x="236" y="7" width="60" height="12" rx="3" fill="#ede9fe" />
    <circle cx="246" cy="13" r="2.5" fill="#6d28d9" />
    <line x1="254" y1="13" x2="288" y2="13" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round" />

    <!-- Top KPI Cards -->
    <g transform="translate(18, 36)">
      <rect x="0" y="0" width="85" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="8" y="8" width="40" height="3" rx="1.5" fill="#64748b" />
      <circle cx="16" cy="23" r="5" fill="#10b981" />
      <line x1="28" y1="23" x2="70" y2="23" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

      <rect x="94" y="0" width="85" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="8" y="8" width="40" height="3" rx="1.5" fill="#64748b" />
      <circle cx="110" cy="23" r="5" fill="#2563eb" />
      <line x1="122" y1="23" x2="164" y2="23" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />

      <rect x="188" y="0" width="86" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="8" y="8" width="40" height="3" rx="1.5" fill="#64748b" />
      <circle cx="204" cy="23" r="5" fill="#7c3aed" />
      <line x1="216" y1="23" x2="258" y2="23" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- BPMN Process Flow Diagram -->
    <g transform="translate(18, 80)">
      <rect x="0" y="0" width="274" height="78" rx="6" fill="#fdf4ff" fill-opacity="0.5" stroke="#f3e8ff" stroke-width="1" />

      <!-- Start Event Circle (Green) -->
      <circle cx="24" cy="38" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" />
      <circle cx="24" cy="38" r="5" fill="#16a34a" />

      <!-- Arrow 1 -->
      <line x1="36" y1="38" x2="52" y2="38" stroke="#7c3aed" stroke-width="1.5" />
      <polygon points="52,35 57,38 52,41" fill="#7c3aed" />

      <!-- Step 1: Elicit & Map Task Box -->
      <rect x="58" y="24" width="56" height="28" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
      <rect x="66" y="32" width="40" height="3" rx="1.5" fill="#1e293b" />
      <rect x="66" y="40" width="28" height="3" rx="1.5" fill="#6d28d9" />

      <!-- Arrow 2 -->
      <line x1="114" y1="38" x2="128" y2="38" stroke="#7c3aed" stroke-width="1.5" />
      <polygon points="128,35 133,38 128,41" fill="#7c3aed" />

      <!-- Decision Diamond (Gateway) -->
      <g transform="translate(144, 38) rotate(45)">
        <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      </g>
      <circle cx="144" cy="38" r="3" fill="#b45309" />

      <!-- Upper Path -->
      <path d="M 144 26 L 144 14 L 176 14" fill="none" stroke="#16a34a" stroke-width="1.2" />
      <polygon points="176,11 180,14 176,17" fill="#16a34a" />
      <rect x="180" y="5" width="56" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
      <line x1="188" y1="15" x2="226" y2="15" stroke="#16a34a" stroke-width="2" stroke-linecap="round" />

      <!-- Lower Path -->
      <path d="M 144 50 L 144 62 L 176 62" fill="none" stroke="#2563eb" stroke-width="1.2" />
      <polygon points="176,59 180,62 176,65" fill="#2563eb" />
      <rect x="180" y="52" width="56" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <line x1="188" y1="62" x2="226" y2="62" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />

      <!-- End Event Double Circle -->
      <path d="M 236 14 L 250 14 L 250 38" fill="none" stroke="#7c3aed" stroke-width="1.2" />
      <path d="M 236 62 L 250 62 L 250 38" fill="none" stroke="#7c3aed" stroke-width="1.2" />
      <circle cx="258" cy="38" r="11" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5" />
      <circle cx="258" cy="38" r="7" fill="#6d28d9" />
    </g>
  </g>
</svg>
