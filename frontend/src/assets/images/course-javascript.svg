<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-label="JavaScript Course Thumbnail">
  <defs>
    <linearGradient id="cjs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="10" fill="url(#cjs-bg)" />
  <circle cx="350" cy="40" r="70" fill="#ffffff" fill-opacity="0.1" />

  <g transform="translate(140, 40)">
    <!-- JS Badge -->
    <rect width="120" height="120" rx="18" fill="#1e293b" stroke="#fef08a" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.25))" />
    <text x="32" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#facc15">JS</text>
  </g>

  <!-- Code brackets in background -->
  <text x="40" y="130" font-family="'Fira Code', monospace" font-size="80" font-weight="700" fill="#ffffff" fill-opacity="0.15">&lt;/&gt;</text>
  <text x="280" y="130" font-family="'Fira Code', monospace" font-size="80" font-weight="700" fill="#ffffff" fill-opacity="0.15">{ ; }</text>
</svg>
